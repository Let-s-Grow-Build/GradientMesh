<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">GradientMesh distributed training architecture</title>
  <description id="description">A draw.io-style architecture diagram comparing traditional single-device training with GradientMesh model parallelism across two laptops connected by Tailscale.</description>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3b82f6"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #172033; }
      .section { font-size: 25px; font-weight: 700; fill: #172033; }
      .label { font-size: 20px; font-weight: 700; fill: #172033; }
      .small { font-size: 16px; fill: #526176; }
      .tiny { font-size: 14px; fill: #526176; }
      .box { stroke-width: 2; rx: 10; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#ffffff"/>
  <rect x="28" y="28" width="1144" height="1144" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g class="font">
    <text x="70" y="86" class="title">GradientMesh</text>
    <text x="70" y="119" class="small">A practical exploration of distributed deep learning</text>
    <line x1="70" y1="145" x2="1130" y2="145" stroke="#cbd5e1" stroke-width="2"/>

    <text x="70" y="193" class="section">Traditional training</text>
    <text x="70" y="221" class="small">The complete model and workload stay on one device.</text>

    <rect x="110" y="265" width="270" height="112" class="box" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="245" y="310" class="label" text-anchor="middle">Training data</text>
    <text x="245" y="339" class="small" text-anchor="middle">One process</text>
    <path d="M380 321H472" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>

    <rect x="472" y="239" width="258" height="164" class="box" fill="#fef3c7" stroke="#d97706"/>
    <text x="601" y="288" class="label" text-anchor="middle">Single GPU</text>
    <rect x="555" y="308" width="92" height="52" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <path d="M575 376H627M601 360V376" stroke="#d97706" stroke-width="2"/>
    <text x="601" y="391" class="tiny" text-anchor="middle">Full model + gradients</text>
    <path d="M730 321H822" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>

    <rect x="822" y="265" width="270" height="112" class="box" fill="#f1f5f9" stroke="#64748b"/>
    <text x="957" y="310" class="label" text-anchor="middle">Model output</text>
    <text x="957" y="339" class="small" text-anchor="middle">Memory bottleneck</text>

    <rect x="390" y="426" width="420" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="600" y="460" class="small" text-anchor="middle">Limited memory and throughput</text>

    <line x1="70" y1="526" x2="1130" y2="526" stroke="#cbd5e1" stroke-width="2"/>
    <text x="70" y="578" class="section">GradientMesh distributed training</text>
    <text x="70" y="606" class="small">Split the model across two laptops and communicate through Tailscale.</text>

    <rect x="74" y="646" width="1052" height="360" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="100" y="681" class="label">Tailscale private network</text>
    <text x="100" y="706" class="tiny">Two physical laptops, one distributed training job</text>

    <rect x="116" y="748" width="330" height="190" class="box" fill="#dbeafe" stroke="#2563eb"/>
    <text x="281" y="785" class="label" text-anchor="middle">Laptop 1 · Rank 0</text>
    <line x1="147" y1="805" x2="415" y2="805" stroke="#93c5fd" stroke-width="2"/>
    <rect x="153" y="831" width="112" height="62" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="209" y="868" class="small" text-anchor="middle">Layer 1</text>
    <text x="209" y="886" class="tiny" text-anchor="middle">CPU / CUDA</text>
    <text x="344" y="855" class="small" text-anchor="middle">Forward</text>
    <text x="344" y="881" class="small" text-anchor="middle">activation</text>

    <rect x="754" y="748" width="330" height="190" class="box" fill="#dcfce7" stroke="#16a34a"/>
    <text x="919" y="785" class="label" text-anchor="middle">Laptop 2 · Rank 1</text>
    <line x1="785" y1="805" x2="1053" y2="805" stroke="#86efac" stroke-width="2"/>
    <rect x="827" y="831" width="112" height="62" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="883" y="868" class="small" text-anchor="middle">Layer 2</text>
    <text x="883" y="886" class="tiny" text-anchor="middle">CPU / CUDA</text>
    <text x="1012" y="855" class="small" text-anchor="middle">Loss +</text>
    <text x="1012" y="881" class="small" text-anchor="middle">backward</text>

    <path d="M446 805H754" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
    <text x="600" y="792" class="tiny" text-anchor="middle" fill="#2563eb">dist.send(activation)</text>
    <path d="M754 906H446" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
    <text x="600" y="932" class="tiny" text-anchor="middle" fill="#16a34a">dist.send(activation.grad)</text>

    <rect x="380" y="1028" width="440" height="56" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="600" y="1063" class="small" text-anchor="middle">Data • Model • Tensor • Pipeline parallelism</text>

    <rect x="58" y="1101" width="1084" height="52" rx="7" fill="#172033"/>
    <circle cx="88" cy="1127" r="13" fill="#a8ff4f"/>
    <path d="M82 1133C84 1122 92 1120 97 1126C90 1125 86 1129 82 1133Z" fill="#172033"/>
    <text x="116" y="1134" fill="#ffffff" font-size="20" font-weight="700">Let's Grow &amp; Build</text>
    <text x="430" y="1134" fill="#a8ff4f" font-size="16" font-weight="700">https://github.com/Let-s-Grow-Build/GradientMesh</text>
  </g>
</svg>
